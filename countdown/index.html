<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6f2438" />
  <title>Wedding Countdown</title>
  <style>
    :root {
      --wine: #76273d;
      --wine-dark: #5c1b2e;
      --gold: #b38a38;
      --cream: #f8f4ef;
      --text: #2d2528;
      --muted: #746a6d;
      --card: rgba(255, 255, 255, 0.82);
      --border: rgba(118, 39, 61, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(179, 138, 56, 0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(118, 39, 61, 0.14), transparent 38%),
        var(--cream);
    }

    .countdown {
      width: min(900px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--wine);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 500;
      line-height: 1;
      color: var(--wine-dark);
    }

    .date {
      margin: 16px 0 34px;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 22px);
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .time-box {
      padding: 24px 10px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 32px rgba(65, 45, 51, 0.07);
      backdrop-filter: blur(8px);
    }

    .number {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 72px);
      line-height: 1;
      color: var(--wine);
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .message {
      min-height: 24px;
      margin: 28px 0 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-style: italic;
    }

    @media (max-width: 620px) {
      body { padding: 18px; }

      .timer {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .time-box {
        padding: 20px 8px 17px;
        border-radius: 14px;
      }

      .date { margin-bottom: 25px; }
    }
  </style>
</head>
<body>
  <main class="countdown">
    <p class="eyebrow">The countdown is on</p>
    <h1>October 24, 2026</h1>
    <p class="date">Until the big day</p>

    <section class="timer" aria-label="Wedding countdown">
      <div class="time-box">
        <span class="number" id="days">0</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <p class="message" id="message"></p>
  </main>

  <script>
    const weddingDate = new Date("2026-10-24T00:00:00-05:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const messageEl = document.getElementById("message");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = weddingDate - Date.now();

      if (distance <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        messageEl.textContent = "Today is the day!";
        return;
      }

      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);

      daysEl.textContent = days;
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
